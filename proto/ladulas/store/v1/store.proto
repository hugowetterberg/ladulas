syntax = "proto3";

// Package ladulas.store.v1 is the local encrypted store's document format.
//
// Unlike ladulas.v1 this is not a wire format — it never leaves the machine.
// It is protobuf anyway so that the things it holds in common with the wire
// schema, notably TTL grants, are the same generated types on disk as in
// flight.
package ladulas.store.v1;

import "google/protobuf/timestamp.proto";
import "ladulas/v1/approval.proto";
import "ladulas/v1/project.proto";
import "ladulas/v1/service.proto";
import "ladulas/v1/wakeup.proto";

option go_package = "github.com/hugowetterberg/ladulas/pkg/storepb;storepb";

enum KeyOrigin {
  KEY_ORIGIN_UNSPECIFIED = 0;
  // Imported from an existing OpenSSH private key, e.g. a 1Password export.
  KEY_ORIGIN_IMPORTED = 1;
  // Generated by Ladulås.
  KEY_ORIGIN_GENERATED = 2;
  // Handed over by a paired peer and accepted here (decision S). It is an
  // origin of its own rather than an import because where a key came from is
  // the first thing anybody asks about a key they did not make.
  KEY_ORIGIN_RECEIVED = 3;
}

// KeyTransfer records a portable key changing machines (§10, decision S).
//
// The same message serves both directions because they are the same event seen
// from two ends: a peer, its name as it was known at the time, and when. The
// name is kept beside the fingerprint for the reason the trust records keep
// one — a fingerprint is what is authoritative, and a sentence a person reads
// six months later needs the name.
message KeyTransfer {
  string peer_fingerprint = 1;
  string peer_name = 2;
  google.protobuf.Timestamp at = 3;
}

// StoredKey is an SSH key Ladulås holds. The private half is stored in
// unencrypted OpenSSH format — the confidentiality comes from the age
// encryption of the whole document, so that a store backup decrypts to
// something usable with ordinary tooling.
message StoredKey {
  // The name the user gave the key. Unique within a store.
  string label = 1;
  string fingerprint = 2;
  string algorithm = 3;
  // The comment from the key file.
  string comment = 4;
  bytes public_key = 5;
  bytes private_key = 6;
  google.protobuf.Timestamp added_at = 7;
  KeyOrigin origin = 8;
  // A disabled key is still stored but is not offered by the agent.
  bool disabled = 9;
  // Set when the private half lives in a platform secure element — an iOS
  // Secure Enclave key, later an Android Keystore one (§10). private_key is
  // then empty and always will be: the point of the arrangement is that these
  // bytes do not exist. The handle is what the platform knows the key by, and
  // the signature is produced behind whatever gate the key was created with,
  // which for an SSH key is a biometric prompt per use.
  string hardware_handle = 10;
  // Every peer this key has been handed to, and when (decision S). A key with
  // entries here exists somewhere else too, whatever anybody would prefer, and
  // the surfaces say so: a transfer cannot be undone, so the record is the
  // closest thing to an undo there is — it is what tells somebody which far
  // ends have to be rotated when a machine is lost.
  //
  // Never populated for a hardware key: a handle cannot be handed over, and
  // this is the field that says so by being empty forever.
  repeated KeyTransfer handed_to = 11;
  // Where the key came from, on a key that arrived from a peer.
  KeyTransfer received_from = 12;
  // Whether this key belongs in an agent's identity list — this instance's own
  // agent socket, and the agent of any peer that borrows it (decision T).
  //
  // Separate from disabled, and a weaker thing: a key with this off is offered
  // to nobody and signs whenever something names it, where a disabled key does
  // neither. What it is for is ssh trying every identity it is handed in turn,
  // against a server that allows six attempts.
  //
  // Optional so that unset means yes, which is what every key written before
  // this field existed has to mean.
  optional bool agent_use = 13;
}

// PendingKeyOffer is a portable key a paired peer has handed over and nobody
// here has accepted yet (decision S).
//
// It holds key material, and it is in the store for the reason a pending
// pairing is: the two ends of the exchange are rarely awake at once. The side
// that sends is typically a phone, which cannot be dialled back, so an offer
// kept in memory would be lost by an ordinary restart and could only be
// recovered by finding the phone again — and the person who has to answer it is
// at the other machine. Sealed with everything else, capped in number so that a
// paired peer cannot grow this store by sending, and holding nothing that is
// not already about to be held: accepting is what makes it a key.
message PendingKeyOffer {
  // Opaque, minted here, and what an acceptance names. It is not the
  // fingerprint because the answer is about this offer rather than about the
  // key, and the same key may be offered twice.
  string id = 1;
  // The peer that sent it, and its name as the trust record had it on arrival.
  string peer_fingerprint = 2;
  string peer_name = 3;
  // What the sender called the key. A label is unique within a store, so the
  // receiving side may have to choose another one; this is what it starts from.
  string label = 4;
  string comment = 5;
  string algorithm = 6;
  string fingerprint = 7;
  bytes public_key = 8;
  // The private half in unencrypted OpenSSH format, as a stored key holds one.
  bytes private_key = 9;
  google.protobuf.Timestamp received_at = 10;
  // What the sending side called this handover, on an offer that was collected
  // rather than pushed. It is what the next collection acknowledges, so that the
  // sender can stop holding the key for a peer that has it.
  string handover_id = 11;
}

// QueuedKeyHandover is a portable key this instance has decided to give a peer
// and has not managed to give it yet (decision S).
//
// It exists because half the peers in this design cannot be dialled. A key sent
// to a desktop is handed over in the call that sends it and never lands here for
// longer than that; a key sent to a phone is queued, the phone is woken, and it
// takes the key when it next polls — the same shape as a parked approval, made
// durable because unlike an approval there is nobody blocked on it and no reason
// for it to expire.
//
// The passphrase was re-entered before this was written, which is what makes the
// queue safe to drain without asking again: the deliberate act has happened, and
// what is left is delivery.
message QueuedKeyHandover {
  string id = 1;
  string peer_fingerprint = 2;
  string peer_name = 3;
  // The key, as the receiving side needs it. The fingerprint is this instance's
  // own key it refers to, which is what a completed handover is written onto.
  string label = 4;
  string comment = 5;
  string fingerprint = 6;
  bytes private_key = 7;
  google.protobuf.Timestamp queued_at = 8;
}

// TrustRecord is a paired peer (§7).
//
// The identity public key is the record: the fingerprint is derived from it for
// display, and so is the SPKI hash the TLS channel pins on, so there is one
// authoritative field and nothing that can drift out of agreement with it.
// Everything else is either what the user decided or what the peer told us.
//
// The two direction flags are declared independently by each side and are not
// negotiated. What the peer says it has written down about us is shown on the
// pairing prompt, and then forgotten: our record says what we allow, and
// revoking is unilateral because nothing about it needs the peer's agreement.
message TrustRecord {
  string fingerprint = 1;
  string name = 2;
  bytes identity_public_key = 3;
  // Addresses the peer says it listens on, best first. Only listeners have
  // any; a phone always dials out (§3).
  repeated string addresses = 4;
  // Whether the peer may approve for us, and whether it may ask us to approve.
  bool may_approve = 5;
  bool may_request = 6;
  // Which of our keys the peer may request signatures with (§7, §16). Empty
  // means none: a pairing grants the right to ask and the right to answer, and
  // the right to borrow a key is a third decision, made separately because its
  // blast radius is different from either of the others.
  repeated string allowed_key_fingerprints = 7;
  // True when the peer may use every key this instance holds, including ones
  // added after the decision was made. The alternative to writing it down is a
  // list that silently fails to cover a key generated tomorrow, which is a
  // worse surprise than a flag somebody set on purpose.
  bool may_use_all_keys = 11;
  google.protobuf.Timestamp paired_at = 8;
  // Corroborating attributes such as a tailnet node name. Never authoritative.
  map<string, string> attributes = 9;
  // Whether this instance dialled the peer's pairing code or displayed its own.
  bool we_initiated = 10;
  // The pairing session this record came out of. It is kept so that a peer
  // still holding the pending half of a completed pairing can be told, exactly,
  // that this side finished it — rather than being told only that nothing is
  // pending here, which is also what a withdrawal looks like (§7).
  //
  // Empty on records written before pairings became durable, and on nothing
  // else. A session id that matches no pending pairing and no record is a
  // session this instance has no memory of, which is the answer that tells the
  // other side to give up.
  string pairing_session_id = 12;
}

// PendingPairing is a pairing whose code has been proven and whose two humans
// have not both answered yet (§7).
//
// It is written down on both sides the moment the code is spent, which is what
// makes the rest of a pairing survive everything that used to end it: a phone
// going to sleep, a daemon restarting, a peer that cannot be reached, and a
// person who walks away and comes back tomorrow. Nothing here expires. The
// code's five minutes bought the right to be in this message at all, and a
// human comparing two fingerprints is not something an attacker can guess.
message PendingPairing {
  // The session id both sides know the attempt by. Minted by the listening
  // side and returned to the dialling side by PairResponse.
  string session_id = 1;
  // The peer as the exchange established it. The identity key is the record and
  // the fingerprint is derived from it, exactly as in TrustRecord.
  string fingerprint = 2;
  string name = 3;
  bytes identity_public_key = 4;
  // Where the peer can be reached. Empty for a phone, which never listens —
  // which is why the side that cannot be dialled must be able to drive the
  // reconciliation itself.
  repeated string addresses = 5;
  // What this side has decided to grant the peer if its user agrees. This is
  // the whole of what completing the pairing will write down.
  bool may_approve = 6;
  bool may_request = 7;
  // What the peer said it grants us. Shown on the prompt, believed by nobody,
  // and never written into a record.
  bool peer_may_approve = 8;
  bool peer_may_request = 9;
  // Whether this side dialled the code or displayed it.
  bool we_dialled = 10;
  // Whether the peer's identity arrived inside the pairing code, which makes
  // the visual channel the integrity root (§7).
  bool key_from_code = 11;
  // The address the exchange came from, for the prompt.
  string remote_address = 12;
  // This side's answer, and the peer's as this side last learned it.
  ladulas.v1.PairingAnswer our_answer = 13;
  ladulas.v1.PairingAnswer their_answer = 14;
  google.protobuf.Timestamp started_at = 15;
  google.protobuf.Timestamp answered_at = 16;
  // The request id of the confirmation prompt this side raised, so that a
  // surface showing the prompt and a surface showing the pending list are
  // talking about the same thing.
  string confirmation_request_id = 17;
}

// BorrowedKey is the public half of a key a paired peer offers this instance
// (§10, decision N).
//
// It is a cache and is written down anyway, for the reason a phone makes
// obvious: what a holder offers used to be learned by asking, so an unreachable
// holder meant the key vanished from every surface that shows keys — and a
// phone is unreachable most of the time by construction. Remembering it makes
// "what can this machine sign with, and where does each of those live" a
// question with an answer at three in the morning.
//
// Only the public half is here, and there is no version of this message that
// could hold more: a KeyRef is a fingerprint, an algorithm, a public key blob,
// a comment and a label. A cached entry can therefore never be used to imply a
// signature — the holder still runs the whole approval decision, and every
// signature still comes back over the channel from the machine that has the
// private half (§8, §16).
message BorrowedKey {
  // The identity fingerprint of the peer that offers it. The trust record is
  // what names it; keeping the fingerprint rather than the name means a rename
  // does not orphan the entry.
  string peer_fingerprint = 1;
  ladulas.v1.KeyRef key = 2;
  // When the holder last confirmed it offers this key. It is what the surfaces
  // show beside a key whose holder is not reachable, because "borrowed from a
  // phone last seen four hours ago" and "borrowed from a phone last seen in
  // March" are different situations.
  google.protobuf.Timestamp last_seen_at = 3;
}

// PeerWakeup is what a peer that approves for this instance has announced about
// being woken (§11, §19 open question 2).
//
// It is written down for the same reason a borrowed key is: what the wake-up
// milestone had to survive is the announcing side being asleep. A phone
// announces once, when its token arrives, and is then unreachable for hours —
// so a requester that kept the route in memory would forget how to wake its
// approver every time the daemon restarted, and would go on not knowing until
// the phone was next picked up, which is precisely the moment it was supposed
// to save.
//
// Nothing here is authority for anything. A route says where to knock; whether
// anybody answers, and whether they may, is decided by the peer channel exactly
// as it was before.
message PeerWakeup {
  string peer_fingerprint = 1;
  ladulas.v1.WakeupRoute route = 2;
  google.protobuf.Timestamp announced_at = 3;
  // Until when that peer expects to answer this instance without asking
  // anybody, as it last said. What the silent-push carve-out is decided from.
  google.protobuf.Timestamp quiet_until = 4;
}

// WakeupSettings is this instance's own half: how it has asked to be woken.
//
// Only an instance that cannot be dialled has any use for it, which today means
// a phone. It is opt-in — §11 says every wake-up mode is — and switching it off
// withdraws the route from every peer that holds one.
message WakeupSettings {
  bool enabled = 1;
  // The relay to register with. Configuration and never a default compiled in,
  // because self-hosting the relay is a supported path and the whole of what it
  // takes on the client is this string (§11).
  string relay_url = 2;
  // The opaque identifier this instance is known by at that relay. Minted here,
  // kept for as long as the relay is unchanged, and handed to peers in an
  // announcement. Changing relays mints a new one: an identifier means nothing
  // at a relay that never issued it.
  string instance_id = 3;
  ladulas.v1.PushPlatform platform = 4;
  // The platform's device token as last seen. Kept only so that a token that
  // has not changed is not re-registered on every launch — the platform is the
  // authority and hands it over again every time the app starts.
  string device_token = 5;
  google.protobuf.Timestamp registered_at = 6;
}

// StoreDocument is the whole decrypted store.
message StoreDocument {
  int32 version = 1;
  // Human assigned name for this instance.
  string instance_name = 2;
  // The instance identity key in OpenSSH private key format (§7). Empty on an
  // instance whose identity lives in a secure element, which is every phone.
  bytes identity_key = 3;
  // Set when the identity is hardware-resident: the handle the platform knows
  // it by, and its public half in SSH wire format so that opening the store
  // does not depend on the secure element being willing to talk (§7, §10).
  //
  // The identity key is deliberately not biometric-gated. It authenticates the
  // channel, and a handshake that asked for a fingerprint would be unusable;
  // the SSH keys are the gated ones.
  string identity_handle = 9;
  bytes identity_public_key = 10;
  google.protobuf.Timestamp created_at = 4;
  repeated StoredKey keys = 5;
  // Live TTL grants. Grants are approver-side state (§18), so they belong to
  // the instance that made the promise and survive a restart here.
  repeated ladulas.v1.Grant grants = 6;
  repeated TrustRecord peers = 7;
  // Pairings that are under way. They live here rather than in memory because
  // an unanswered pairing has to survive a restart on either side, and here
  // rather than beside the store because who is trying to pair with this
  // machine is the same map the trust records are (§7, §10). The cost is
  // stated rather than worked around: a sealed instance can neither list nor
  // answer a pending pairing.
  repeated PendingPairing pending_pairings = 11;
  // Projects this instance publishes to its approvers (§6). Only the record of
  // what is published lives here — the pages an approver reads are served out
  // of the working directory, and the ones it keeps are kept beside its own
  // store, sealed with the same key.
  repeated ladulas.v1.Publication publications = 8;
  // Whether to publish, automatically, any project this instance sends an
  // approval request for (decision Q). Unset means yes: the moment an approver
  // most wants a project's documentation is while it is being asked to sign
  // something in it, and having to remember to publish first is how nobody ever
  // has it. It is optional rather than a plain bool so that "nobody has said"
  // and "somebody said no" are different states, because the default is on.
  optional bool auto_publish = 14;
  // How the peers that approve for this instance have asked to be woken (§11),
  // and how this instance has asked to be woken itself. Both are in the store
  // because both are the peer map again: a route says "that machine is a phone
  // reachable at this relay under this identifier", and the identifier is a
  // capability that wakes it.
  repeated PeerWakeup peer_wakeups = 15;
  WakeupSettings wakeups = 16;
  // The public halves of the keys paired peers offer this instance, so that
  // they can be listed when the peer that holds them cannot be reached
  // (decision N). Encrypted with everything else, because which machine holds
  // which key is the same map the trust records are.
  repeated BorrowedKey borrowed_keys = 12;
  // Delegations paired approvers have handed this instance (decision P): the
  // signed artifact, and what has been done under it and not yet reported.
  //
  // These are the other side of `grants`. A grant here is a promise this
  // instance made and keeps; a delegation is one it was given, and the reason
  // it can answer for itself while the approver is asleep.
  repeated HeldDelegation held_delegations = 13;
  // Portable keys paired peers have handed over, waiting for somebody here to
  // accept them (decision S). Nothing in this list is usable: it is not offered
  // by the agent, not lent to a peer and not listed as a key, because it is not
  // one until it has been accepted.
  repeated PendingKeyOffer pending_key_offers = 17;
  // Portable keys this instance has decided to hand to a peer and has not
  // delivered yet — always empty for longer than a moment only when the peer is
  // a phone, which cannot be dialled and comes to collect instead.
  repeated QueuedKeyHandover queued_key_handovers = 18;
}

// HeldDelegation is a delegation this instance was given, and its ledger.
message HeldDelegation {
  // The signed artifact exactly as it arrived. Kept whole rather than taken
  // apart, because the signature covers these bytes and re-marshalling could
  // produce different ones.
  ladulas.v1.SignedDelegation signed = 1;
  // The delegation the artifact covers, unmarshalled once the signature
  // verified, so that matching a request against it does not mean verifying a
  // signature on every request.
  ladulas.v1.Delegation delegation = 2;
  // When it arrived.
  google.protobuf.Timestamp received_at = 3;
  // What has been self-approved under it and not yet acknowledged by the
  // approver. Kept until it is, so that a machine that has been offline for a
  // week still has an account to give when it comes back.
  repeated ladulas.v1.GrantUse unreported_uses = 4;
  // How many times it has been used in total, which is the number worth
  // showing and does not shrink when a report is acknowledged.
  uint32 use_count = 5;
}
