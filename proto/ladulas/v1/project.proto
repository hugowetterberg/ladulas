syntax = "proto3";

// Project publishing and browsing (§6, decision Q). A requester marks a project
// as published to the peers that approve for it, and marking it sends nothing;
// an approver that wants to read one asks — for the projects on offer, for a
// directory at a time, for a name across the whole of it, and for the files it
// opens — and keeps what it has read.
//
// Everything here is requester-asserted display content and nothing else. It is
// never evidence about a signature, it is rendered as untrusted text by the
// shared viewer (§12), and the caps that bound it exist because an approver's
// disk and an approver's patience are both finite.
package ladulas.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/hugowetterberg/ladulas/pkg/protocol/ladulasv1;ladulasv1";

// Publication is a project on offer: what it is called, where it lives on the
// requester, and what commit it is at.
//
// It is the whole of what publishing carries. The contents are read a call at a
// time by whoever wants them, so a publication that nobody opens costs one
// record on the machine that made it and nothing anywhere else.
message Publication {
  // Stable across publications of the same project, derived from the origin URL
  // and the repository path so that the requester and the approver arrive at it
  // independently — which is what lets a signing request name a project without
  // carrying one.
  string project_id = 1;
  string name = 2;
  // Where the project lives on the requester.
  string path = 3;
  string origin_url = 4;
  // The branch and commit the project is at. They are re-read every time the
  // project is listed rather than frozen at publication, because the commit is
  // what the staleness label compares a signing request against and a machine
  // that has been committing all afternoon has moved.
  string branch = 5;
  string commit = 6;
  // When the project was first marked published.
  google.protobuf.Timestamp published_at = 7;
}

// ProjectEntry is one thing in a directory, as an approver sees it.
message ProjectEntry {
  string name = 1;
  // The path relative to the project root, which is what every other call
  // takes.
  string path = 2;
  bool directory = 3;
  int64 size = 4;
  google.protobuf.Timestamp modified = 5;
  // Whether the publisher would serve the contents. A file too large for the
  // caps, or of a kind that is not offered, is still listed — a browser that
  // silently omitted it would be lying about what the project contains.
  bool readable = 6;
  // Why not, when it is not.
  string reason = 7;
  // For a directory: nothing anywhere beneath it is a file this instance would
  // serve. It answers the question a browser cannot answer for itself without a
  // call per folder — the publisher is walking its own disk, an approver would
  // be walking it down a network — and it is what lets a viewer that shows only
  // what it can read leave out the folders that lead nowhere.
  //
  // It is stated the empty way round on purpose. A publisher that has never
  // heard of the field sends nothing, which reads as false, and a browser that
  // hides on true then hides nothing rather than hiding every folder there is.
  // A walk that hits its own cap before finding anything reports false for the
  // same reason: not knowing is not the same as knowing there is nothing.
  bool nothing_readable = 8;
  // The contents are a prefix of the file: it is longer than the per-file cap,
  // and what is served is cut back to the last line ending before it. `size`
  // stays the whole file's size, so a reader can say how much of it is here.
  //
  // Stated the empty way round, like nothing_readable: a publisher that has
  // never heard of the field sends nothing, which reads as false, and a reader
  // then says nothing rather than labelling every document as cut short.
  bool truncated = 9;
}

// KindPolicy is what a publisher does with one kind of file (decision AP).
//
// An approver is told this so that it can tell three different silences apart:
// a document that has not arrived yet, one that will never be pushed and must
// be asked for, and one this publisher will not serve at all. Without it an
// empty sync answer and a project full of unservable files look the same.
message KindPolicy {
  // What a person calls this kind, for the sentence explaining a file that was
  // not offered.
  string name = 1;
  // The extensions it matches, with the leading dot.
  repeated string extensions = 2;
  // Whether the contents may be handed over at all. A kind that is not served
  // is still listed (§6).
  bool serve = 3;
  // Whether the publisher sends these ahead of being asked.
  bool push = 4;
  // What history it can answer for: "none", "git", or "snapshots".
  string versions = 5;
}

// DocumentVersionKind says where a version came from, which decides both what
// it means and how long it will still be there.
enum DocumentVersionKind {
  DOCUMENT_VERSION_KIND_UNSPECIFIED = 0;
  // A working-tree state the publisher captured between two commits. It exists
  // because git has no record of what a file looked like between them — and it
  // lives only until HEAD moves, because after that it describes a tree that no
  // longer exists (decision AP).
  DOCUMENT_VERSION_KIND_SNAPSHOT = 1;
  // A commit that touched the document. Permanent, and read from the
  // repository at the moment of asking.
  DOCUMENT_VERSION_KIND_COMMIT = 2;
}

// DocumentVersion is one state of a document a reader may ask to see.
message DocumentVersion {
  DocumentVersionKind kind = 1;
  // For a snapshot: the digest it is stored under, and how it is fetched.
  bytes digest = 2;
  // For a commit: the hash, and how it is fetched.
  string commit = 3;
  int64 size = 4;
  // When the snapshot was taken, or when the commit was authored.
  google.protobuf.Timestamp at = 5;
  // For a commit: its subject line and author, which is what a version list
  // shows beside it. A snapshot has neither — nobody wrote a message about
  // saving a file.
  string subject = 6;
  string author = 7;
}

// SyncEntry is one document an approver already holds, as it describes it to a
// publisher.
//
// The digest is the approver's own, computed over what it has. It is sent so
// that the publisher can answer with what differs rather than with everything;
// what comes back is still verified against the bytes, so a publisher that
// lied about a digest would gain nothing but a wasted transfer.
message SyncEntry {
  string path = 1;
  bytes digest = 2;
}

// SyncChangeKind is what happened to one document since the approver last
// looked.
enum SyncChangeKind {
  SYNC_CHANGE_KIND_UNSPECIFIED = 0;
  // The approver does not have it, or has different bytes. The contents come
  // with it.
  SYNC_CHANGE_KIND_PUT = 1;
  // The approver has it, it is a kind this publisher pushes, and the publisher
  // does not have it — so it has been deleted or renamed away. No contents.
  //
  // A path that is *not* a pushed kind is never reported here, however little
  // the publisher has at it. An approver's cache also holds pages it pulled
  // because somebody opened them (decision Q), and a reconciliation that
  // removed everything the publisher does not push would delete those — pages
  // that are legitimately readable and that nobody said anything about.
  SYNC_CHANGE_KIND_REMOVE = 2;
}
