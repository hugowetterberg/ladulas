# Points ssh, git and everything else at the Ladulås agent, so that the tools
# people and agents actually reach for — `ssh`, `ssh-add -l`, `git push` — find
# it with no per-shell configuration.
#
# Install into ~/.config/environment.d/ (`make install-env`), or let a package
# put it in /usr/lib/environment.d/. The systemd user manager reads these at
# startup and expands ${XDG_RUNTIME_DIR} itself, so the path is right on every
# machine without being written out.
#
# What this does not reach is a session systemd did not start: an `ssh` into
# this box, or a bare TTY login. Those still need the export in a shell rc, and
# `ladulas doctor` says so when it finds one.
#
# The variable is contended. GnuPG's gpg-agent-ssh.socket wants it too, and so
# do 1Password and Secretive; whichever writes last wins, and the symptom is a
# key list from the wrong agent rather than an error. The file is numbered 50
# to sort after a distribution default and before a user's own 90-.
SSH_AUTH_SOCK=${XDG_RUNTIME_DIR}/ladulas/agent.sock
