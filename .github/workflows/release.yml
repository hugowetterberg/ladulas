name: release

# A tag is the whole trigger, because the tag is the whole version: nothing in
# the tree records which tag points at a commit, so pushing `v1.2.3` is what
# tells goreleaser what to build and what to stamp into the binaries.
#
#	git tag -a v1.2.3 -m 'what changed'
#	git push origin v1.2.3
#
# workflow_dispatch is here for the case where the release job failed after the
# tag was already pushed — deleting and re-pushing a tag to retry is how you end
# up with two different commits having been v1.2.3.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: existing tag to release
        type: string
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # The happy path is around ten minutes: four for the tests, one for the
    # linter, a couple for the two GTK compiles and their apt, two for
    # goreleaser's eight binaries, and the packaging commit. This is not sized to
    # that. A release job that runs out of time leaves a published tag whose
    # packaging never landed, and it is the one step here that cannot be made
    # cheap by trying harder — the apt below is a third party's mirror on a day
    # of its choosing. So the limit is set to survive a bad one rather than to
    # describe a good one, with the step that would spend it capped separately.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          # goreleaser works out the changelog from the range between this tag
          # and the one before it, so a shallow clone gives it one commit and a
          # changelog to match.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The gate. A tag that does not pass its tests is a tag somebody will
      # install. Not `make`: generate needs buf and Docker and would only be
      # checking that committed generated code matches itself.
      - name: Test
        run: go test ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      # The GTK packages are built from source on the user's machine, which
      # means a compile error in the tray does not surface here — it surfaces
      # for whoever ran makepkg, hours later, as a failed build of a release
      # that CI called green. That has already happened once: internal/gui used
      # keystore.ErrNoSuchGrant without importing the package and nothing
      # noticed, because neither `make test` nor golangci-lint compiles a file
      # behind a build tag nobody passes. So both tag combinations get built
      # here, and the GTK 4 one is the reason this needs apt at all.
      #
      # The apt is what makes this step worth a timeout of its own. It is 169
      # packages and 97 MB, which is seconds on a healthy runner and was 23m56s
      # at 55.8 kB/s on the first attempt at v0.0.1 — a degraded Azure mirror,
      # not a slow compile. The two `go build`s never ran; the job's own limit
      # cancelled the step mid-`Setting up`, and the only thing said about it was
      # that the job had exceeded its maximum execution time.
      #
      # 35 minutes, then, and the number is chosen from that: it is above the
      # worst rate actually seen, because a mirror that is slow but making
      # progress should be waited out rather than turned into a re-run, and a
      # release is worth half an hour. What it is for is the case that is not
      # slow but stuck, where it fails in the step that is stuck and names it
      # rather than reporting the job. It also leaves the rest of the hour for
      # goreleaser and the packaging commit, which is the part that must not be
      # what runs out of time: a tag published without its packaging is the one
      # outcome here that needs a human.
      #
      # Acquire::Retries is for the other shape of the same weather: 80 MB at
      # dial-up speed is long enough for a connection to be dropped part way
      # through, and re-running the release is a worse way to retry one file.
      - name: Check that the tray still compiles
        timeout-minutes: 35
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install --no-install-recommends -y -o Acquire::Retries=3 \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libgtk-4-dev libwebkitgtk-6.0-dev
          go build -tags gui,gtk3 -o /dev/null ./cmd/ladulas
          go build -tags gui -o /dev/null ./cmd/ladulas

      # contrib/ladulas.desktop is what draws the menu entry, the autostart
      # entry and — because GTK 4 has no API that takes an icon as bytes — the
      # window's own icon. Nothing compiles it, so a typo in a key name is a
      # file that installs fine and then does none of those three, silently: a
      # desktop entry with an unparseable line is skipped, not reported. This is
      # the only thing that reads it before somebody's session does.
      #
      # Any output at all is a failure, which is stricter than the exit status:
      # desktop-file-validate exits 0 for a "hint", and the hints are the ones
      # about menu categories — an unpaired Additional Category leaves a menu
      # free to file the entry nowhere, which is the entry not working while the
      # check passed.
      - name: Validate the desktop entry
        run: |
          sudo apt-get install --no-install-recommends -y \
            -o Acquire::Retries=3 desktop-file-utils
          output="$(desktop-file-validate contrib/ladulas.desktop 2>&1)"
          if [ -n "${output}" ]; then
            echo "${output}"
            exit 1
          fi

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The packaging is committed rather than pushed by goreleaser itself. All
      # three packages live in one repository, and three pipes each cloning,
      # committing and pushing to it race — a "fetch first" rejection halfway
      # through leaves a release whose packaging is two thirds updated, which is
      # worse than one that failed outright. So they are written locally
      # (skip_upload) and land here as a single commit.
      - name: Check out the package repository
        uses: actions/checkout@v7
        with:
          repository: hugowetterberg/ladulas-aur
          path: .ladulas-aur
          ssh-key: ${{ secrets.AUR_REPO_KEY }}

      - name: Update the packaging
        working-directory: .ladulas-aur
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          for pkg in ladulas-headless-bin ladulas ladulas-gtk3; do
            mkdir -p "${pkg}"
            cp "../dist/aur/${pkg}.pkgbuild" "${pkg}/PKGBUILD"
            cp "../dist/aur/${pkg}.srcinfo" "${pkg}/.SRCINFO"
          done

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add ladulas-headless-bin ladulas ladulas-gtk3

          # Nothing to commit is a real outcome, not a failure: re-running a
          # release over an unchanged tag should be harmless.
          if git diff --cached --quiet; then
            echo "the packaging is already current for ${VERSION}"
            exit 0
          fi

          git commit -m "ladulas ${VERSION}"
          git push
